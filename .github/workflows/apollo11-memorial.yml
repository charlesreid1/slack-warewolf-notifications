# .github/workflows/apollo11-memorial.yml
name: Apollo 11 Memorial

on:
  schedule:
    # Each event fires at its historically accurate real-time moment (PDT → UTC).
    # GitHub Actions cron may run several minutes late; message text carries the exact time.
    - cron: '32 13 16 7 *'  # Launch:        Jul 16, 6:32 AM PDT (13:32 UTC)
    - cron: '17 20 20 7 *'  # Landing:       Jul 20, 1:17 PM PDT (20:17 UTC)
    - cron: '54 17 21 7 *'  # Lunar liftoff: Jul 21, 10:54 AM PDT (17:54 UTC)
    - cron: '50 16 24 7 *'  # Splashdown:    Jul 24, 9:50 AM PDT (16:50 UTC)
  workflow_dispatch: # Allow manual triggering

jobs:
  check-events:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pytz

    - name: Check for Apollo 11 anniversaries and send notifications
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: python apollo11_memorial.py
